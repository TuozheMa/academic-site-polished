<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }} | Tuozhe Ma</title>

  <style>
    body {
      margin: 0;
      background: #f4f4f4;
      color: #333;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      line-height: 1.65;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .top {
      background: #000;
      color: white;
      padding: 36px 56px 32px 56px;
    }

    .site-title {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 38px;
      font-weight: 300;
      margin-bottom: 28px;
    }

    .site-title a {
      color: white;
      text-decoration: none;
    }

    .nav {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 22px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .nav a {
      color: #f2f2f2;
      margin-right: 34px;
      text-decoration: none;
    }

    .nav a:hover {
      color: white;
      text-decoration: underline;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 70px 42px 100px 42px;
      background: #f4f4f4;
    }

    .eyebrow {
      color: #5e239d;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 34px 0;
      color: #000;
      font-size: 72px;
      line-height: 1.05;
      font-weight: 800;
    }

    h2 {
      margin-top: 44px;
      margin-bottom: 16px;
      color: #111;
      font-size: 36px;
      line-height: 1.2;
    }

    h3 {
      margin-top: 30px;
      margin-bottom: 10px;
      color: #111;
      font-size: 28px;
    }

    p {
      margin: 0 0 24px 0;
    }

    ul {
      margin-top: 8px;
      margin-bottom: 28px;
      padding-left: 36px;
    }

    li {
      margin: 10px 0;
    }

    .content {
      max-width: 900px;
    }

    .footer {
      background: #000;
      color: #ddd;
      padding: 34px 56px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 24px;
    }

    @media (max-width: 760px) {
      body {
        font-size: 19px;
      }

      .top {
        padding: 26px 24px;
      }

      .site-title {
        font-size: 30px;
      }

      .nav a {
        display: inline-block;
        margin-right: 16px;
        margin-bottom: 10px;
        font-size: 17px;
      }

      .container {
        padding: 48px 24px 70px 24px;
      }

      h1 {
        font-size: 52px;
      }

      h2 {
        font-size: 30px;
      }

      .eyebrow {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <header class="top">
    <div class="site-title">
      <a href="/">Tuozhe Ma</a>
    </div>

    <nav class="nav">
      <a href="/">Home</a>
      <a href="/about/">About</a>
      <a href="/research/">Research</a>
      <a href="/projects/">Projects</a>
      <a href="/cv/">CV</a>
    </nav>
  </header>

  <main class="container">
    <div class="eyebrow">Tuozhe Ma</div>

    <h1>{{ .Title }}</h1>

    <div class="content">
      {{ .Content }}
    </div>
  </main>

  <footer class="footer">
    © Tuozhe Ma 2026
  </footer>

</body>
</html>

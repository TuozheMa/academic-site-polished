<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }} | Tuozhe Ma 「马拓哲」</title>

  <style>
    body {
      margin: 0;
      background: #f4f4f4;
      color: #222;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 17px;
      line-height: 1.75;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .hero {
      background: #000;
      color: #f2f2f2;
      text-align: center;
      padding: 78px 24px 54px 24px;
    }

    .hero-title {
  font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  font-size: 54px;
  font-weight: 400;
  letter-spacing: 0.01em;
  margin: 0;
  color: #cfcfcf;
  opacity: 1;
  text-shadow: none;
}

.hero-name {
  font-family: inherit;
  font-weight: 400;
  color: #cfcfcf;
  opacity: 1;
}

    .hero-subtitle {
      font-size: 18px;
      font-weight: 300;
      margin-top: 18px;
      color: #f0f0f0;
    }

    .nav {
      margin-top: 38px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 38px;
      flex-wrap: wrap;
    }

    .nav a {
      color: #ffffff;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .main {
      max-width: 760px;
      margin: 0 auto;
      padding: 46px 32px 80px 32px;
      text-align: center;
    }

    .page-title {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 30px;
      font-weight: 400;
      color: #333;
      margin: 0 0 30px 0;
    }

    .content {
      text-align: center;
    }

    .content h2 {
      font-size: 22px;
      font-weight: 400;
      margin-top: 34px;
      margin-bottom: 18px;
      color: #333;
    }

    .content h3 {
      font-size: 19px;
      font-weight: 400;
      margin-top: 28px;
      margin-bottom: 14px;
      color: #333;
    }

    .content p {
      margin: 0 auto 18px auto;
      max-width: 720px;
    }

    .content ul {
      display: inline-block;
      text-align: left;
      margin: 0 auto 18px auto;
      padding-left: 24px;
    }

    .content li {
      margin: 6px 0;
    }

    .content hr {
      border: none;
      border-top: 1px solid #d2d2d2;
      margin: 36px auto;
      max-width: 720px;
    }

    @media (max-width: 700px) {
      .hero {
        padding: 58px 20px 42px 20px;
      }

      .hero-title {
        font-size: 38px;
      }

      .hero-subtitle {
        font-size: 16px;
      }

      .nav {
        gap: 22px;
      }

      .main {
        padding: 38px 24px 64px 24px;
      }

      .page-title {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <header class="hero">
    <h1 class="hero-title">
      <span class="hero-name">Tuozhe Ma</span>
      <span class="hero-name">「马拓哲」</span>
    </h1>

    <div class="hero-subtitle">Personal Academic Homepage</div>

    <nav class="nav">
      <a href="/">Home</a>
      <a href="/about/">About</a>
      <a href="/research/">Research</a>
      <a href="/projects/">Projects</a>
      <a href="/cv/">CV</a>
    </nav>
  </header>

  <main class="main">
    <h1 class="page-title">{{ .Title }}</h1>

    <div class="content">
       {{ .Content }} 
    </div>
  </main>

</body>
</html>
